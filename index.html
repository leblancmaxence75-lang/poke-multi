<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Poké-Multi Games by Vegechou</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
        .hidden { display: none; }
        .box { background: #1e1e1e; border: 2px solid #ee1515; padding: 20px; border-radius: 20px; display: inline-block; width: 400px; vertical-align: top; margin: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .gold-txt { color: gold; font-weight: bold; }
        .orange-header { background: #ff8c00; color: black; font-weight: bold; padding: 12px; border-radius: 8px 8px 0 0; text-align: left; margin-top: 15px; }
        .stats-table { width: 100%; border-collapse: collapse; background: white; color: #333; }
        .stats-table td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; font-weight: bold; }
        .stat-bar { height: 12px; border-radius: 4px; display: inline-block; border: 1px solid #555; margin-left: 10px; vertical-align: middle; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; transition: 0.2s; }
        .btn-stat { background: #333; color: white; border: 1px solid #555; width: 120px; }
        .btn-stat.selected { border: 2px solid gold; background: #443a10; }
        #timer { font-size: 2em; color: #ee1515; font-weight: bold; margin: 10px; }
        .poke-card { background: #333; padding: 5px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .poke-card img { width: 100%; }
        .poke-card.selected { border-color: gold; background: #443a10; }
        .poke-card.gray { filter: grayscale(100%); opacity: 0.3; }
        #chat-zone { background: #1a1a1a; border: 1px solid #444; height: 150px; overflow-y: auto; padding: 10px; text-align: left; font-size: 0.8em; margin: 10px 0; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="lobby" class="box">
        <h1>Poké-Multi Games</h1>
        <p>Joueur : <span id="display-name" class="gold-txt">...</span></p>
        <div style="background: #181818; padding: 15px; border-radius: 12px; margin-bottom: 15px;">
            <button id="m-battle" onclick="setMode('battle')" style="background: #ee1515; color: white;">POKÉ-BATTLE</button>
            <button id="m-guess" onclick="setMode('guess')" style="background: #333; color: white;">QUI EST-CE ?</button>
        </div>
        <input type="text" id="r" placeholder="Code Room" style="padding: 10px; border-radius: 5px; width: 60%;"> <br>
        <button onclick="go(true)" style="background: #ee1515; color: white;">CRÉER</button>
        <button onclick="go(false)" style="background: #3b4cca; color: white;">REJOINDRE</button>
    </div>

    <div id="game-battle" class="hidden">
        <div class="box">
            <h3 id="statut-battle">Préparation...</h3>
            <div id="ready-zone-battle">
                <button id="btn-ready-battle" style="background: gold; color: black; padding: 20px;" onclick="setReady()">JE SUIS PRÊT !</button>
            </div>
            <div id="combat-zone" class="hidden">
                <div id="timer">5</div>
                <h2 id="n-battle">???</h2>
                <img id="i-battle" src="" style="width:180px;">
                <div id="btns-battle" style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                    <button class="btn-stat" id="b-hp" onclick="selectStat('hp')">PV</button>
                    <button class="btn-stat" id="b-atk" onclick="selectStat('atk')">ATTAQUE</button>
                    <button class="btn-stat" id="b-def" onclick="selectStat('def')">DÉFENSE</button>
                    <button class="btn-stat" id="b-spa" onclick="selectStat('spa')">ATK SPÉ</button>
                    <button class="btn-stat" id="b-spd" onclick="selectStat('spd')">DÉF SPÉ</button>
                    <button class="btn-stat" id="b-spe" onclick="selectStat('spe')">VIT</button>
                </div>
            </div>
            <div id="lock-zone" class="hidden">
                <img src="https://cdn-icons-png.flaticon.com/512/3064/3064155.png" style="width:60px; filter:invert(1);">
                <p>Choix verrouillé !</p>
            </div>
            <div id="res-battle" class="hidden">
                <div class="orange-header">Résultats du Round</div>
                <table class="stats-table" id="res-table"></table>
                <h2 id="win-battle" style="color: gold;"></h2>
                <button id="next-btn" style="background: gold; color: black; width: 100%; display:none;" onclick="nextRound()">ROUND SUIVANT</button>
            </div>
        </div>
    </div>

    <div id="game-guess" class="hidden">
        <div class="box" style="width: 450px;">
            <div id="guess-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;"></div>
        </div>
        <div class="box">
            <div id="setup-guess">
                <p>Choisis ton Pokémon cible :</p>
                <button style="background:gold;" onclick="readyGuess()">VALIDER MON CHOIX</button>
            </div>
            <div id="play-guess" class="hidden">
                <div id="chat-zone"></div>
                <input type="text" id="q-input" style="width:60%;"> <button onclick="sendMsg('question')">POSER</button>
                <div style="margin-top:10px;">
                    <button onclick="sendMsg('Oui')" style="background:green; color:white;">OUI</button>
                    <button onclick="sendMsg('Non')" style="background:red; color:white;">NON</button>
                </div>
                <button onclick="enableGuessMode()" style="background: gold; width: 100%; margin-top:20px;">TENTER UN GUESS !</button>
            </div>
        </div>
    </div>

    <script>
        const conf = { databaseURL: "https://pokebattle-3c608-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(conf);
        const db = firebase.database();

        let user = localStorage.getItem('pokeUser') || prompt("Pseudo :") || "Dresseur";
        localStorage.setItem('pokeUser', user);
        document.getElementById('display-name').innerText = user;

        let room, host, mode = 'battle', roomRef, currentPoke, myTotal = 0, selectedStat = null, timerInt, isReady = false, amIGuessing = false, targetId = null;

        function setMode(m) {
            mode = m;
            document.getElementById('m-battle').style.background = m === 'battle' ? '#ee1515' : '#333';
            document.getElementById('m-guess').style.background = m === 'guess' ? '#ee1515' : '#333';
        }

        async function go(isHost) {
            room = document.getElementById('r').value.trim(); host = isHost;
            if(!room) return;
            roomRef = db.ref('rooms/' + room);
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-' + mode).classList.remove('hidden');

            if(host) {
                let init = { mode: mode, round: 1, start: false };
                if(mode === 'battle') init.poke = await fetchPoke();
                else init.grid = await fetch30();
                roomRef.set(init);
            }
            roomRef.child('p/' + user).set({ name: user, val: -1, total: 0, ready: false });

            roomRef.on('value', snap => {
                const d = snap.val(); if(!d) return;
                const players = Object.values(d.p || {});
                
                if(mode === 'battle') {
                    if(!d.start && players.length === 2 && players[0].ready && players[1].ready) roomRef.update({ start: true });
                    if(d.start) updateUIBattle(d, players);
                } else {
                    updateUIGuess(d);
                }
            });
        }

        async function fetchPoke() {
            const r = await fetch('https://pokeapi.co/api/v2/pokemon/' + (Math.floor(Math.random()*1025)+1));
            const p = await r.json();
            return { name: p.name.toUpperCase(), img: p.sprites.other['official-artwork'].front_default, stats: { hp:p.stats[0].base_stat, atk:p.stats[1].base_stat, def:p.stats[2].base_stat, spa:p.stats[3].base_stat, spd:p.stats[4].base_stat, spe:p.stats[5].base_stat } };
        }

        async function fetch30() {
            let arr = [];
            for(let i=0; i<30; i++) {
                const r = await fetch('https://pokeapi.co/api/v2/pokemon/' + (Math.floor(Math.random()*1025)+1));
                const p = await r.json();
                arr.push({ id: p.id, name: p.name.toUpperCase(), img: p.sprites.other['official-artwork'].front_default });
            }
            return arr;
        }

        // LOGIQUE BATTLE
        function setReady() {
            roomRef.child('p/' + user).update({ ready: true });
            document.getElementById('btn-ready-battle').innerText = "ATTENTE...";
            document.getElementById('btn-ready-battle').disabled = true;
        }

        function updateUIBattle(d, players) {
            currentPoke = d.poke;
            document.getElementById('ready-zone-battle').classList.add('hidden');
            document.getElementById('n-battle').innerText = d.poke.name;
            document.getElementById('i-battle').src = d.poke.img;
            document.getElementById('statut-battle').innerText = "Round " + d.round + "/6";
            
            if(document.getElementById('combat-zone').classList.contains('hidden') && !document.getElementById('lock-zone').classList.contains('visible') && players.every(p => p.val === -1)) {
                launchTimer();
            }

            if(players.length === 2 && players[0].val !== -1 && players[1].val !== -1) {
                clearInterval(timerInt);
                showFinalResBattle(players, d.poke);
            }
        }

        function launchTimer() {
            document.getElementById('combat-zone').classList.remove('hidden');
            document.getElementById('res-battle').classList.add('hidden');
            document.getElementById('lock-zone').classList.add('hidden');
            let sec = 5; document.getElementById('timer').innerText = sec;
            timerInt = setInterval(() => {
                sec--; document.getElementById('timer').innerText = sec;
                if(sec <= 0) { clearInterval(timerInt); lockChoice(); }
            }, 1000);
        }

        function selectStat(s) {
            selectedStat = s;
            document.querySelectorAll('.btn-stat').forEach(b => b.classList.remove('selected'));
            document.getElementById('b-' + s).classList.add('selected');
        }

        function lockChoice() {
            let val = selectedStat ? currentPoke.stats[selectedStat] : currentPoke.stats['hp'];
            myTotal += val;
            roomRef.child('p/' + user).update({ val: val, total: myTotal });
            document.getElementById('combat-zone').classList.add('hidden');
            document.getElementById('lock-zone').classList.remove('hidden');
        }

        function showFinalResBattle(pl, poke) {
            const table = document.getElementById('res-table'); table.innerHTML = "";
            const keys = ["hp","atk","def","spa","spd","spe"];
            keys.forEach(k => {
                let v = poke.stats[k];
                table.innerHTML += `<tr><td>${k.toUpperCase()}</td><td>${v} <span class="stat-bar" style="width:${v/2}px; background:orange"></span></td></tr>`;
            });
            let win = pl[0].val > pl[1].val ? pl[0].name : (pl[1].val > pl[0].val ? pl[1].name : "Égalité");
            document.getElementById('win-battle').innerText = "🏆 Gagnant : " + win;
            document.getElementById('res-battle').classList.remove('hidden');
            document.getElementById('lock-zone').classList.add('hidden');
            if(host) document.getElementById('next-btn').style.display = "block";
        }

        async function nextRound() {
            const snap = await roomRef.get();
            const d = snap.val();
            if(d.round >= 6) {
                let p = Object.values(d.p);
                alert("FIN ! VAINQUEUR : " + (p[0].total > p[1].total ? p[0].name : p[1].name));
                location.reload();
            } else {
                roomRef.update({ round: d.round + 1, poke: await fetchPoke() });
                roomRef.child('p').once('value', s => s.forEach(c => c.ref.update({ val: -1 })));
                document.getElementById('next-btn').style.display = "none";
            }
        }

        // LOGIQUE GUESS
        function updateUIGuess(d) {
            if(!document.getElementById('guess-grid').innerHTML && d.grid) {
                d.grid.forEach(p => {
                    document.getElementById('guess-grid').innerHTML += `<div class="poke-card" id="pc-${p.id}" onclick="clickGuess(${p.id})"><img src="${p.img}"><p style="font-size:0.6em;">${p.name}</p></div>`;
                });
            }
            if(d.messages) {
                const z = document.getElementById('chat-zone'); z.innerHTML = "";
                Object.values(d.messages).forEach(m => z.innerHTML += `<div><b>${m.u}:</b> ${m.t}</div>`);
                z.scrollTop = z.scrollHeight;
            }
        }

        function clickGuess(id) {
            if(!isReady) {
                document.querySelectorAll('.poke-card').forEach(c => c.classList.remove('selected'));
                document.getElementById('pc-'+id).classList.add('selected'); targetId = id;
            } else if(amIGuessing) {
                checkFinalGuess(id);
            } else {
                document.getElementById('pc-'+id).classList.toggle('gray');
            }
        }

        function readyGuess() {
            if(!targetId) return alert("Choisis d'abord !");
            isReady = true; roomRef.child('p/' + user).update({ secret: targetId });
            document.getElementById('setup-guess').classList.add('hidden');
            document.getElementById('play-guess').classList.remove('hidden');
        }

        function sendMsg(t) {
            let txt = t === 'question' ? document.getElementById('q-input').value : t;
            roomRef.child('messages').push({ u: user, t: txt });
            document.getElementById('q-input').value = "";
        }

        function enableGuessMode() { amIGuessing = true; alert("Clique sur un Pokémon pour Guesser !"); }

        async function checkFinalGuess(id) {
            const snap = await roomRef.get();
            let opp; Object.keys(snap.val().p).forEach(k => { if(k !== user) opp = snap.val().p[k]; });
            if(id === opp.secret) alert("GAGNÉ !"); else alert("PERDU !");
            location.reload();
        }
    </script>
</body>
</html>
