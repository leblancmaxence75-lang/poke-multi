<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Poké-Multi Games by Vegechou</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
        .hidden { display: none; }
        .box { background: #1e1e1e; border: 2px solid #ee1515; padding: 20px; border-radius: 20px; display: inline-block; width: 400px; vertical-align: top; margin: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .gold-txt { color: gold; font-weight: bold; }
        .orange-header { background: #ff8c00; color: black; font-weight: bold; padding: 12px; border-radius: 8px 8px 0 0; text-align: left; margin-top: 15px; }
        .stats-table { width: 100%; border-collapse: collapse; background: white; color: #333; margin-bottom: 10px; }
        .stats-table td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; font-weight: bold; font-size: 0.9em; }
        .stat-bar { height: 12px; border-radius: 4px; display: inline-block; border: 1px solid #555; margin-left: 10px; vertical-align: middle; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; transition: 0.2s; }
        .btn-stat { background: #333; color: white; border: 1px solid #555; width: 120px; height: 45px; font-size: 0.8em; }
        .btn-stat.selected { border: 2px solid gold; background: #443a10; }
        .btn-stat.locked { background: #111 !important; color: #555 !important; border: 1px solid #222 !important; cursor: not-allowed; opacity: 0.6; }
        .btn-stat.locked::after { content: " 🔒"; }
        #timer { font-size: 2.5em; color: #ee1515; font-weight: bold; margin: 10px; text-shadow: 0 0 10px rgba(238,21,21,0.5); }
        .poke-card { background: #333; padding: 5px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .poke-card img { width: 100%; pointer-events: none; }
        .poke-card.gray { filter: grayscale(100%); opacity: 0.3; }
        #chat-zone { background: #111; height: 150px; overflow-y: auto; padding: 10px; text-align: left; font-size: 0.9em; margin-bottom: 10px; border-radius: 10px; border: 1px solid #444; }
        .res-img { width: 80px; height: 80px; background: #333; border-radius: 10px; margin: 5px; }
        .final-panel { background: #252525; border: 2px solid gold; padding: 15px; border-radius: 15px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="lobby" class="box">
        <h1>Poké-Multi Games</h1>
        <p>Joueur : <span id="display-name" class="gold-txt">...</span></p>
        <div style="background: #181818; padding: 15px; border-radius: 12px; margin-bottom: 15px;">
            <button id="m-battle" onclick="setMode('battle')" style="background: #ee1515; color: white;">POKÉ-BATTLE</button>
            <button id="m-guess" onclick="setMode('guess')" style="background: #333; color: white;">QUI EST-CE ?</button>
        </div>
        <input type="text" id="r" placeholder="Code Room" style="padding: 10px; border-radius: 5px; width: 60%;"> <br>
        <button onclick="go(true)" style="background: #ee1515; color: white;">CRÉER</button>
        <button onclick="go(false)" style="background: #3b4cca; color: white;">REJOINDRE</button>
    </div>

    <div id="game-battle" class="hidden">
        <div class="box">
            <h3 id="statut-battle">Préparation...</h3>
            <div id="ready-zone-battle"><button id="btn-ready-battle" style="background: gold; color: black; padding: 20px; font-size: 1.2em;" onclick="setReady()">JE SUIS PRÊT !</button></div>
            <div id="combat-zone" class="hidden">
                <div id="timer">5</div>
                <h2 id="n-battle">???</h2>
                <img id="i-battle" src="" style="width:180px; height: 180px; object-fit: contain;">
                <div id="btns-battle" style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top:10px;">
                    <button class="btn-stat" id="b-hp" onclick="selectStat('hp')">PV</button>
                    <button class="btn-stat" id="b-atk" onclick="selectStat('atk')">ATTAQUE</button>
                    <button class="btn-stat" id="b-def" onclick="selectStat('def')">DÉFENSE</button>
                    <button class="btn-stat" id="b-spa" onclick="selectStat('spa')">ATK SPÉ</button>
                    <button class="btn-stat" id="b-spd" onclick="selectStat('spd')">DÉF SPÉ</button>
                    <button class="btn-stat" id="b-spe" onclick="selectStat('spe')">VIT</button>
                </div>
            </div>
            <div id="lock-zone" class="hidden"><p>Choix envoyé !<br><small>Attente de l'adversaire...</small></p></div>
            <div id="res-battle" class="hidden">
                <div class="orange-header">Résultats du Round</div>
                <table class="stats-table" id="res-table"></table>
                <h2 id="win-round" style="color: gold;"></h2>
                <button id="next-btn" style="background: gold; color: black; width: 100%; margin-top: 10px;" onclick="nextRound()">ROUND SUIVANT</button>
            </div>
            <div id="final-battle-panel" class="hidden">
                <h2 style="color: gold;">🏆 RÉCAPITULATIF FINAL 🏆</h2>
                <div id="recap-content"></div>
                <h1 id="overall-winner" style="background: gold; color: black; padding: 10px; border-radius: 10px;"></h1>
                <button onclick="location.reload()" style="background: #ee1515; color: white; width: 100%; margin-top: 15px;">RETOUR AU LOBBY</button>
            </div>
        </div>
    </div>

    <div id="game-guess" class="hidden">
        <div class="box" style="width: 450px;">
            <div id="guess-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;"></div>
        </div>
        <div class="box">
            <div id="setup-guess">
                <h2 id="setup-title">Choisis ton Pokémon</h2>
                <p id="setup-msg">Clique sur un Pokémon dans la grille.</p>
                <button id="btn-valider-guess" style="background:gold; padding: 15px;" onclick="readyGuess()">VALIDER MON CHOIX</button>
            </div>
            <div id="play-guess" class="hidden">
                <div id="chat-zone"></div>
                <input type="text" id="q-input" style="width:60%;" placeholder="Ta question..."> <button onclick="sendMsg('question')">POSER</button>
                <div style="margin-top:10px;"><button onclick="sendMsg('Oui')" style="background:green; color:white;">OUI</button><button onclick="sendMsg('Non')" style="background:red; color:white;">NON</button></div>
                <button onclick="enableGuessMode()" style="background: gold; width: 100%; margin-top:20px;">TENTER UN GUESS FINAL !</button>
            </div>
            <div id="finish-guess" class="hidden">
                <h2 id="guess-res-title">RÉSULTATS</h2>
                <div id="guess-recap-box"></div>
                <h3 id="guess-final-msg" style="color: gold; margin-top: 15px;"></h3>
                <button onclick="location.reload()" style="background: #ee1515; color: white; width: 100%;">RETOUR AU MENU</button>
            </div>
        </div>
    </div>

    <script>
        const conf = { databaseURL: "https://pokebattle-3c608-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(conf);
        const db = firebase.database();

        let user = localStorage.getItem('pokeUser') || prompt("Pseudo :") || "Dresseur";
        localStorage.setItem('pokeUser', user);
        document.getElementById('display-name').innerText = user;

        let room, host, mode = 'battle', roomRef, currentPoke, myTotal = 0, selectedStat = null, timerInt, currentRound = 0;
        let usedStats = [], isReadyGuess = false, amIGuessing = false, targetId = null, fullGrid = [], myHistory = [];

        function setMode(m) {
            mode = m;
            document.getElementById('m-battle').style.background = m === 'battle' ? '#ee1515' : '#333';
            document.getElementById('m-guess').style.background = m === 'guess' ? '#ee1515' : '#333';
        }

        async function go(isHost) {
            room = document.getElementById('r').value.trim(); host = isHost;
            if(!room) return;
            roomRef = db.ref('rooms/' + room);
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-' + mode).classList.remove('hidden');

            if(host) {
                let init = { mode: mode, round: 1, start: false, battleOver: false };
                if(mode === 'battle') init.poke = await fetchPoke();
                else init.grid = await fetch30();
                roomRef.set(init);
            }
            roomRef.child('p/' + user).set({ name: user, val: -1, total: 0, ready: false, secret: null, history: [] });

            roomRef.on('value', snap => {
                const d = snap.val(); if(!d) return;
                const pl = Object.values(d.p || {});
                
                if(mode === 'battle') {
                    if(d.battleOver) { showFinalBattleUI(pl); return; }
                    if(d.start) {
                        if(pl.every(p => p.val !== -1)) { clearInterval(timerInt); showResultRound(pl, d); }
                        else if(d.round !== currentRound) { currentRound = d.round; resetInterfaceForNewRound(d); }
                    } else if(pl.length === 2 && pl.every(p => p.ready)) { if(host) roomRef.update({ start: true }); }
                } else {
                    if(d.finalResult) showFinalGuessUI(d);
                    else updateUIGuess(d, pl);
                }
            });
        }

        async function fetchPoke() {
            const r = await fetch('https://pokeapi.co/api/v2/pokemon/' + (Math.floor(Math.random()*1025)+1));
            const p = await r.json();
            return { name: p.name.toUpperCase(), img: p.sprites.other['official-artwork'].front_default, stats: { hp:p.stats[0].base_stat, atk:p.stats[1].base_stat, def:p.stats[2].base_stat, spa:p.stats[3].base_stat, spd:p.stats[4].base_stat, spe:p.stats[5].base_stat } };
        }

        async function fetch30() {
            let arr = [];
            for(let i=0; i<30; i++) {
                const r = await fetch('https://pokeapi.co/api/v2/pokemon/' + (Math.floor(Math.random()*1025)+1));
                const p = await r.json();
                arr.push({ id: p.id, name: p.name.toUpperCase(), img: p.sprites.other['official-artwork'].front_default });
            }
            return arr;
        }

        // --- BATTLE LOGIC ---
        function resetInterfaceForNewRound(d) {
            currentPoke = d.poke; selectedStat = null;
            document.getElementById('ready-zone-battle').classList.add('hidden');
            document.getElementById('res-battle').classList.add('hidden');
            document.getElementById('lock-zone').classList.add('hidden');
            document.getElementById('combat-zone').classList.remove('hidden');
            document.getElementById('n-battle').innerText = d.poke.name;
            document.getElementById('i-battle').src = d.poke.img;
            document.getElementById('statut-battle').innerText = "Round " + d.round + "/6";
            document.querySelectorAll('.btn-stat').forEach(b => {
                b.classList.remove('selected');
                if(usedStats.includes(b.id.replace('b-', ''))) { b.classList.add('locked'); b.disabled = true; }
                else { b.classList.remove('locked'); b.disabled = false; }
            });
            launchTimer();
        }

        function launchTimer() {
            clearInterval(timerInt); let sec = 5;
            document.getElementById('timer').innerText = sec;
            timerInt = setInterval(() => {
                sec--; document.getElementById('timer').innerText = sec;
                if(sec <= 0) { clearInterval(timerInt); sendChoice(); }
            }, 1000);
        }

        function selectStat(s) { if(!usedStats.includes(s)) { selectedStat = s; document.querySelectorAll('.btn-stat').forEach(b => b.classList.remove('selected')); document.getElementById('b-' + s).classList.add('selected'); } }

        function sendChoice() {
            if(!selectedStat) selectedStat = ['hp','atk','def','spa','spd','spe'].find(k => !usedStats.includes(k));
            let val = currentPoke.stats[selectedStat] || 0;
            usedStats.push(selectedStat); myTotal += val;
            myHistory.push({ statName: selectedStat.toUpperCase(), value: val });
            roomRef.child('p/' + user).update({ val: val, total: myTotal, history: myHistory });
            document.getElementById('combat-zone').classList.add('hidden');
            document.getElementById('lock-zone').classList.remove('hidden');
        }

        function showResultRound(pl, d) {
            const table = document.getElementById('res-table'); table.innerHTML = "";
            ["hp","atk","def","spa","spd","spe"].forEach(k => {
                let v = d.poke.stats[k];
                table.innerHTML += `<tr><td>${k.toUpperCase()}</td><td>${v} <span class="stat-bar" style="width:${v/2}px; background:orange"></span></td></tr>`;
            });
            let win = pl[0].val > pl[1].val ? pl[0].name : (pl[1].val > pl[0].val ? pl[1].name : "Égalité");
            document.getElementById('win-round').innerText = "Round gagné par : " + win;
            document.getElementById('res-battle').classList.remove('hidden');
            if(host) document.getElementById('next-btn').style.display = "block";
        }

        async function nextRound() {
            const snap = await roomRef.get(); const d = snap.val();
            if(d.round >= 6) { roomRef.update({ battleOver: true }); }
            else {
                await roomRef.child('p').once('value', s => s.forEach(c => c.ref.update({ val: -1 })));
                roomRef.update({ round: d.round + 1, poke: await fetchPoke() });
            }
        }

        function showFinalBattleUI(pl) {
            document.getElementById('game-battle').querySelectorAll('.box > div').forEach(div => div.classList.add('hidden'));
            document.getElementById('final-battle-panel').classList.remove('hidden');
            const recap = document.getElementById('recap-content'); recap.innerHTML = "";
            pl.forEach(p => {
                let tableHtml = `<div class="final-panel"><h3>${p.name}</h3><table class="stats-table">`;
                (p.history || []).forEach(h => { tableHtml += `<tr><td>${h.statName}</td><td>${h.value}</td></tr>`; });
                tableHtml += `<tr style="background:gold; color:black;"><td>TOTAL</td><td>${p.total}</td></tr></table></div>`;
                recap.innerHTML += tableHtml;
            });
            let winner = pl[0].total > pl[1].total ? pl[0].name : (pl[1].total > pl[0].total ? pl[1].name : "ÉGALITÉ");
            document.getElementById('overall-winner').innerText = "VAINQUEUR : " + winner;
        }

        function setReady() { roomRef.child('p/' + user).update({ ready: true }); document.getElementById('btn-ready-battle').innerText = "ATTENTE..."; }

        // --- GUESS LOGIC ---
        function updateUIGuess(d, pl) {
            if(!document.getElementById('guess-grid').innerHTML && d.grid) {
                fullGrid = d.grid;
                d.grid.forEach(p => { 
                    document.getElementById('guess-grid').innerHTML += `<div class="poke-card" id="pc-${p.id}" onclick="clickGuess(${p.id})"><img src="${p.img}"><p style="font-size:0.6em;">${p.name}</p></div>`; 
                });
            }
            
            // On vérifie que les DEUX joueurs ont un secret != null
            if(pl.length === 2 && pl.every(p => p.secret !== null)) {
                document.getElementById('setup-guess').classList.add('hidden');
                document.getElementById('play-guess').classList.remove('hidden');
            } else if(isReadyGuess) {
                document.getElementById('setup-msg').innerText = "Attente de l'adversaire...";
                document.getElementById('btn-valider-guess').classList.add('hidden');
            }

            if(d.messages) {
                const z = document.getElementById('chat-zone'); z.innerHTML = "";
                Object.values(d.messages).forEach(m => z.innerHTML += `<div><b>${m.u}:</b> ${m.t}</div>`);
                z.scrollTop = z.scrollHeight;
            }
        }

        function clickGuess(id) {
            if(!isReadyGuess) { 
                document.querySelectorAll('.poke-card').forEach(c => c.style.borderColor = "transparent"); 
                document.getElementById('pc-'+id).style.borderColor = "gold"; 
                targetId = id; 
            } else if(amIGuessing) { 
                sendFinalGuess(id); 
            } else { 
                document.getElementById('pc-'+id).classList.toggle('gray'); 
            }
        }

        function readyGuess() { 
            if(targetId) { 
                isReadyGuess = true; 
                roomRef.child('p/' + user).update({ secret: targetId }); 
            } else {
                alert("Choisis un Pokémon d'abord !");
            }
        }

        function sendMsg(t) { 
            let txt = t === 'question' ? document.getElementById('q-input').value : t; 
            if(txt) { 
                roomRef.child('messages').push({ u: user, t: txt }); 
                document.getElementById('q-input').value = ""; 
            } 
        }

        function enableGuessMode() { 
            amIGuessing = true; 
            alert("Clique maintenant sur le Pokémon de l'adversaire dans la grille !"); 
        }

        async function sendFinalGuess(id) {
            const snap = await roomRef.get();
            const d = snap.val();
            const players = d.p;
            const myName = user;
            const oppKey = Object.keys(players).find(k => k !== myName);
            const opponent = players[oppKey];

            let win = (id === opponent.secret);
            
            roomRef.update({ 
                finalResult: { 
                    winner: win ? myName : opponent.name, 
                    p1: myName, 
                    p1Secret: players[myName].secret, 
                    p2: opponent.name, 
                    p2Secret: opponent.secret 
                } 
            });
        }

        function showFinalGuessUI(res) {
            document.getElementById('play-guess').classList.add('hidden');
            document.getElementById('finish-guess').classList.remove('hidden');
            
            const p1Data = fullGrid.find(p => p.id === res.finalResult.p1Secret);
            const p2Data = fullGrid.find(p => p.id === res.finalResult.p2Secret);
            
            document.getElementById('guess-recap-box').innerHTML = `
                <div style="display:flex; justify-content:space-around; align-items:center;">
                    <div class="final-panel" style="width:40%">
                        <p>${res.finalResult.p1}</p>
                        <img src="${p1Data.img}" style="width:100%">
                        <p class="gold-txt">${p1Data.name}</p>
                    </div>
                    <h2 style="color:red">VS</h2>
                    <div class="final-panel" style="width:40%">
                        <p>${res.finalResult.p2}</p>
                        <img src="${p2Data.img}" style="width:100%">
                        <p class="gold-txt">${p2Data.name}</p>
                    </div>
                </div>`;
            document.getElementById('guess-final-msg').innerText = "🏆 VICTOIRE DE : " + res.finalResult.winner;
        }
    </script>
</body>
</html>
