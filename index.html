<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Poké-Multi Games V8</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
        .hidden { display: none !important; }
        .box { background: #1e1e1e; border: 2px solid #ee1515; padding: 20px; border-radius: 20px; display: inline-block; width: 420px; vertical-align: top; margin: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .gold-txt { color: gold; font-weight: bold; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; transition: 0.2s; }
        
        /* Poké-Battle (Locké) */
        .btn-stat { background: #333; color: white; width: 120px; height: 45px; border: 1px solid #555; }
        .btn-stat.selected { border: 2px solid gold; background: #443a10; }
        .btn-stat:disabled { opacity: 0.3; cursor: not-allowed; }
        #timer { font-size: 2.5em; color: #ee1515; font-weight: bold; }

        /* Qui est-ce */
        .grid-container { width: 480px; }
        .guess-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; min-height: 200px; }
        .poke-card { background: #333; padding: 5px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .poke-card img { width: 100%; pointer-events: none; }
        .poke-card.selected-secret { border-color: #00ff00 !important; background: #0a2e0a; }
        .poke-card.gray { filter: grayscale(100%); opacity: 0.2; }
        .poke-card.guess-target { border-color: gold !important; background: #443a10; }
        
        #chat-zone { background: #111; height: 120px; overflow-y: auto; padding: 10px; text-align: left; border-radius: 10px; border: 1px solid #444; margin: 10px 0; }
        .status-bar { background: #000; padding: 10px; border-radius: 10px; margin-bottom: 10px; color: gold; font-weight: bold; border: 1px solid gold; }
        .final-panel { background: #252525; border: 2px solid gold; padding: 15px; border-radius: 15px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="lobby" class="box">
        <h1>Poké-Multi Games</h1>
        <p>Joueur : <span id="display-name" class="gold-txt">...</span></p>
        <div style="margin-bottom: 15px;">
            <button id="m-battle" onclick="setMode('battle')" style="background: #ee1515; color: white;">BATTLE</button>
            <button id="m-guess" onclick="setMode('guess')" style="background: #333; color: white;">QUI EST-CE ?</button>
        </div>
        <input type="text" id="r" placeholder="Code Room" style="padding: 10px; width: 150px; border-radius: 5px;">
        <button onclick="go(true)" style="background: #ee1515; color: white;">CRÉER</button>
        <button onclick="go(false)" style="background: #3b4cca; color: white;">REJOINDRE</button>
    </div>

    <div id="game-battle" class="hidden">
        <div class="box">
            <h3 id="statut-battle">Attente...</h3>
            <div id="ready-zone-battle"><button id="btn-ready-battle" style="background: gold; color: black; padding: 20px;" onclick="setReady()">JE SUIS PRÊT !</button></div>
            <div id="combat-zone" class="hidden">
                <div id="timer">5</div>
                <h2 id="n-battle">???</h2>
                <img id="i-battle" src="" style="width:180px; height: 180px; object-fit: contain;">
                <div id="btns-battle" style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top:10px;">
                    <button class="btn-stat" id="b-hp" onclick="selectStat('hp')">PV</button>
                    <button class="btn-stat" id="b-atk" onclick="selectStat('atk')">ATTAQUE</button>
                    <button class="btn-stat" id="b-def" onclick="selectStat('def')">DÉFENSE</button>
                    <button class="btn-stat" id="b-spa" onclick="selectStat('spa')">ATK SPÉ</button>
                    <button class="btn-stat" id="b-spd" onclick="selectStat('spd')">DÉF SPÉ</button>
                    <button class="btn-stat" id="b-spe" onclick="selectStat('spe')">VIT</button>
                </div>
            </div>
            <div id="res-battle" class="hidden">
                <h2 id="win-round" style="color: gold;"></h2>
                <button id="next-btn" style="background: gold; color: black; width: 100%; display:none;" onclick="nextRound()">ROUND SUIVANT</button>
            </div>
            <div id="final-battle-panel" class="hidden">
                <h2 style="color: gold;">🏆 SCORE FINAL 🏆</h2>
                <div id="recap-content"></div>
                <h1 id="overall-winner" style="background: gold; color: black; padding: 10px; border-radius: 10px;"></h1>
                <button onclick="location.reload()" style="background: #ee1515; color: white; width: 100%;">QUITTER</button>
            </div>
        </div>
    </div>

    <div id="game-guess" class="hidden">
        <div class="box grid-container"><div id="guess-grid" class="guess-grid"></div></div>
        <div class="box">
            <div id="wait-players-guess" class="status-bar">Prêts : 0/2</div>
            <div id="setup-guess">
                <h3>CHOISIS TON POKÉMON</h3>
                <p>Clique sur un Pokémon puis sur VALIDER.</p>
                <button id="btn-confirm-secret" style="background:gold; width:100%; padding:15px;" onclick="confirmSecret()">VALIDER (PRÊT)</button>
            </div>
            <div id="play-guess" class="hidden">
                <div id="chat-zone"></div>
                <input type="text" id="q-input" style="width:50%;" placeholder="Question..."> 
                <button onclick="sendMsg('question')">POSER</button>
                <div style="margin-top:5px;">
                    <button onclick="sendMsg('OUI')" style="background:green; color:white;">OUI</button>
                    <button onclick="sendMsg('NON')" style="background:red; color:white;">NON</button>
                </div>
                <hr style="border:0; border-top:1px solid #444; margin:15px 0;">
                <button id="btn-toggle-guess" onclick="enableGuessMode()" style="background: gold; width: 100%;">TENTER UN GUESS FINAL !</button>
                <button id="btn-submit-guess" class="hidden" onclick="sendFinalGuess()" style="background: #00ff00; color:black; width: 100%;">VALIDER MON GUESS</button>
            </div>
            <div id="finish-guess" class="hidden">
                <div id="guess-recap-box" style="display: flex; justify-content: space-around; margin-bottom: 10px;"></div>
                <h2 id="guess-final-msg" style="color: gold;"></h2>
                <button onclick="location.reload()" style="background: #ee1515; color: white; width: 100%;">RETOUR AU MENU</button>
            </div>
        </div>
    </div>

    <script>
        const conf = { databaseURL: "https://pokebattle-3c608-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(conf);
        const db = firebase.database();

        let user = localStorage.getItem('pokeUser') || prompt("Pseudo :") || "Joueur";
        localStorage.setItem('pokeUser', user);
        document.getElementById('display-name').innerText = user;

        let room, host, mode = 'battle', roomRef, timerInt, currentRound = 0;
        let usedStats = [], myTotal = 0, currentPoke = null, selectedStat = null, myHistory = [];
        let tempSecretId = null, isSecretLocked = false, isGuessMode = false, guessTargetId = null, fullGrid = [];

        function setMode(m) {
            mode = m;
            document.getElementById('m-battle').style.background = m === 'battle' ? '#ee1515' : '#333';
            document.getElementById('m-guess').style.background = m === 'guess' ? '#ee1515' : '#333';
        }

        async function go(isHost) {
            room = document.getElementById('r').value.trim(); host = isHost;
            if(!room) return;
            roomRef = db.ref('rooms/' + room);
            if(host) {
                await roomRef.remove();
                let init = { mode: mode, round: 1, start: false, battleOver: false };
                if(mode === 'battle') init.poke = await fetchPoke();
                else init.grid = await fetch30();
                roomRef.set(init);
            }
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-' + mode).classList.remove('hidden');
            roomRef.child('p/' + user).set({ name: user, val: -1, total: 0, ready: false, secret: null, history: [] });

            roomRef.on('value', snap => {
                const d = snap.val(); if(!d) return;
                const pl = d.p ? Object.values(d.p) : [];
                if(mode === 'battle') {
                    if(d.battleOver) showFinalBattleUI(pl);
                    else if(d.start) {
                        if(pl.every(p => p.val !== -1) && pl.length === 2) { clearInterval(timerInt); showResultRound(pl, d); }
                        else if(d.round !== currentRound) { currentRound = d.round; resetBattleRound(d); }
                    } else if(pl.length === 2 && pl.every(p => p.ready)) { if(host) roomRef.update({ start: true }); }
                } else {
                    if(d.finalResult) showFinalGuessUI(d.finalResult);
                    else handleGuessSync(d, pl);
                }
            });
        }

        async function fetchPoke() {
            const r = await fetch('https://pokeapi.co/api/v2/pokemon/' + (Math.floor(Math.random()*1010)+1));
            const p = await r.json();
            return { name: p.name.toUpperCase(), img: p.sprites.other['official-artwork'].front_default, stats: { hp:p.stats[0].base_stat, atk:p.stats[1].base_stat, def:p.stats[2].base_stat, spa:p.stats[3].base_stat, spd:p.stats[4].base_stat, spe:p.stats[5].base_stat } };
        }

        async function fetch30() {
            let arr = [];
            for(let i=0; i<30; i++) {
                const r = await fetch('https://pokeapi.co/api/v2/pokemon/' + (Math.floor(Math.random()*1010)+1));
                const p = await r.json();
                arr.push({ id: p.id, name: p.name.toUpperCase(), img: p.sprites.other['official-artwork'].front_default });
            }
            return arr;
        }

        // --- BATTLE (LOCKÉ) ---
        function setReady() { roomRef.child('p/' + user).update({ ready: true }); }
        function resetBattleRound(d) {
            currentPoke = d.poke; selectedStat = null;
            document.getElementById('ready-zone-battle').classList.add('hidden');
            document.getElementById('res-battle').classList.add('hidden');
            document.getElementById('combat-zone').classList.remove('hidden');
            document.getElementById('n-battle').innerText = d.poke.name;
            document.getElementById('i-battle').src = d.poke.img;
            document.getElementById('statut-battle').innerText = "Round " + d.round + "/6";
            document.querySelectorAll('.btn-stat').forEach(b => { b.classList.remove('selected'); b.disabled = usedStats.includes(b.id.replace('b-', '')); });
            startTimer();
        }
        function startTimer() {
            clearInterval(timerInt); let s = 5; document.getElementById('timer').innerText = s;
            timerInt = setInterval(() => { s--; document.getElementById('timer').innerText = s; if(s<=0) { clearInterval(timerInt); submitBattleChoice(); } }, 1000);
        }
        function selectStat(s) { selectedStat = s; document.querySelectorAll('.btn-stat').forEach(b => b.classList.remove('selected')); document.getElementById('b-'+s).classList.add('selected'); }
        function submitBattleChoice() {
            if(!selectedStat) selectedStat = ['hp','atk','def','spa','spd','spe'].find(k => !usedStats.includes(k));
            let val = currentPoke.stats[selectedStat];
            usedStats.push(selectedStat); myTotal += val;
            myHistory.push({ statName: selectedStat.toUpperCase(), value: val });
            roomRef.child('p/' + user).update({ val: val, total: myTotal, history: myHistory });
            document.getElementById('combat-zone').classList.add('hidden');
        }
        function showResultRound(pl, d) {
            document.getElementById('res-battle').classList.remove('hidden');
            let win = pl[0].val > pl[1].val ? pl[0].name : (pl[1].val > pl[0].val ? pl[1].name : "Égalité");
            document.getElementById('win-round').innerText = "Vainqueur : " + win;
            if(host) document.getElementById('next-btn').style.display = "block";
        }
        async function nextRound() {
            const snap = await roomRef.once('value'); const d = snap.val();
            if(d.round >= 6) roomRef.update({ battleOver: true });
            else { for(let k in d.p) roomRef.child('p/'+k).update({ val: -1 }); roomRef.update({ round: d.round + 1, poke: await fetchPoke() }); }
        }
        function showFinalBattleUI(pl) {
            document.getElementById('game-battle').innerHTML = `<div class="box"><h2>FIN</h2><div id="rcp"></div><h1 id="ovw"></h1><button onclick="location.reload()">MENU</button></div>`;
            pl.forEach(p => {
                let h = `<div class="final-panel"><h3>${p.name}</h3><table style="width:100%; color:white;">`;
                p.history.forEach(s => { h += `<tr><td>${s.statName}</td><td>${s.value}</td></tr>`; });
                h += `<tr style="color:gold"><td>TOTAL</td><td>${p.total}</td></tr></table></div>`;
                document.getElementById('rcp').innerHTML += h;
            });
            let win = pl[0].total > pl[1].total ? pl[0].name : (pl[1].total > pl[0].total ? pl[1].name : "ÉGALITÉ");
            document.getElementById('ovw').innerText = "GAGNANT : " + win;
        }

        // --- QUI EST-CE (SYNC & REVEAL FIX) ---
        function handleGuessSync(d, pl) {
            if(!d.grid) return;
            
            if(!fullGrid.length || document.getElementById('guess-grid').innerHTML === "") {
                fullGrid = d.grid;
                let html = "";
                d.grid.forEach(p => { 
                    html += `<div class="poke-card" id="pc-${p.id}" onclick="clickGuess(${p.id})"><img src="${p.img}"><p style="font-size:0.6em;">${p.name}</p></div>`; 
                });
                document.getElementById('guess-grid').innerHTML = html;
            }

            const pWithSecret = pl.filter(p => p.secret !== null && p.secret !== undefined);
            document.getElementById('wait-players-guess').innerText = `Prêts : ${pWithSecret.length}/2`;
            
            if(pl.length === 2 && pWithSecret.length === 2) {
                document.getElementById('setup-guess').classList.add('hidden');
                document.getElementById('wait-players-guess').classList.add('hidden');
                document.getElementById('play-guess').classList.remove('hidden');
            } else {
                document.getElementById('setup-guess').classList.remove('hidden');
                document.getElementById('play-guess').classList.add('hidden');
            }

            if(d.messages) {
                document.getElementById('chat-zone').innerHTML = Object.values(d.messages).map(m => `<div><b>${m.u}:</b> ${m.t}</div>`).join('');
                document.getElementById('chat-zone').scrollTop = 9999;
            }
        }

        function clickGuess(id) {
            const card = document.getElementById('pc-'+id);
            if(!isSecretLocked) {
                document.querySelectorAll('.poke-card').forEach(c => c.classList.remove('selected-secret'));
                card.classList.add('selected-secret'); tempSecretId = id;
            } else if(isGuessMode) {
                document.querySelectorAll('.poke-card').forEach(c => c.classList.remove('guess-target'));
                card.classList.add('guess-target'); guessTargetId = id;
            } else { card.classList.toggle('gray'); }
        }

        function confirmSecret() {
            if(!tempSecretId) return alert("Choisis un Pokémon !");
            isSecretLocked = true;
            roomRef.child('p/' + user).update({ secret: tempSecretId });
            document.getElementById('setup-guess').innerHTML = `<p class="gold-txt">Secret validé ! En attente...</p>`;
        }

        function enableGuessMode() {
            isGuessMode = true;
            document.getElementById('btn-toggle-guess').classList.add('hidden');
            document.getElementById('btn-submit-guess').classList.remove('hidden');
        }

        async function sendFinalGuess() {
            if(!guessTargetId) return alert("Sélectionne ton guess !");
            const snap = await roomRef.once('value'); const d = snap.val();
            const opponent = Object.values(d.p).find(p => p.name !== user);
            const win = (guessTargetId === opponent.secret);
            roomRef.update({ finalResult: { guesser: user, winner: win ? user : opponent.name, isSuccess: win, p1: user, p1S: d.p[user].secret, p2: opponent.name, p2S: opponent.secret } });
        }

        function showFinalGuessUI(res) {
            document.getElementById('game-guess').innerHTML = `<div class="box"><h2>RÉVÉLATION FINALE</h2><div id="gres" style="display:flex; justify-content:space-around;"></div><h2 id="guess-status" style="margin-top:10px;"></h2><h1 id="gwin" style="background:gold; color:black; padding:10px; border-radius:10px;"></h1><button onclick="location.reload()" style="background: #ee1515; color: white; width: 100%;">RETOUR AU MENU</button></div>`;
            const c1 = fullGrid.find(x => x.id === res.p1S); const c2 = fullGrid.find(x => x.id === res.p2S);
            document.getElementById('gres').innerHTML = `
                <div class="final-panel"><b>${res.p1}</b><br><img src="${c1.img}" width="100"><br>${c1.name}</div>
                <div class="final-panel"><b>${res.p2}</b><br><img src="${c2.img}" width="100"><br>${c2.name}</div>`;
            
            const statusTxt = res.isSuccess ? `✅ LE GUESS DE ${res.guesser.toUpperCase()} ÉTAIT BON !` : `❌ LE GUESS DE ${res.guesser.toUpperCase()} ÉTAIT FAUX !`;
            document.getElementById('guess-status').innerText = statusTxt;
            document.getElementById('guess-status').style.color = res.isSuccess ? "#00ff00" : "#ff0000";
            document.getElementById('gwin').innerText = "VAINQUEUR : " + res.winner;
        }

        function sendMsg(type) {
            let t = type === 'question' ? document.getElementById('q-input').value : type;
            if(t) { roomRef.child('messages').push({ u: user, t: t }); document.getElementById('q-input').value = ""; }
        }
    </script>
</body>
</html>
